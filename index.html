<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Camilo &amp; Maritza – Nuestra historia</title>

  <!-- ═══════════════════════════════════════════════════
       INVITACIÓN EN MODO LIBRO DE CUENTOS
       Misma información que invitacion-completa.html (config.js),
       presentada como un libro: la tapa es la portada "toca para
       abrir", cada sección es una página y el footer es la contratapa.
       Estilos en css/book.css · lógica de páginas en js/book.js
  ════════════════════════════════════════════════════ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Lato:ital,wght@0,400;0,700;1,400&family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/common.css" />
  <link rel="stylesheet" href="./css/sections.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/book.css" />
</head>

<body class="book-closed">

<button id="audio-toggle" title="Música de fondo" aria-label="Alternar música">🎵</button>

<!-- js/init.js genera aquí el menú móvil; en el libro no se usa -->
<div id="mobile-menu" hidden></div>

<!-- ════════════════════════════════════════════════════
     EL LIBRO
     Doble página con el lomo al centro. Cada .leaf ocupa la mitad
     derecha y gira sobre el lomo: su frente es una página derecha y
     su reverso, al voltearse, la página izquierda siguiente.
       Hoja 0: tapa            / guarda
       Hoja 1: p1 Prólogo      / p2 Ceremonia
       Hoja 2: p3 Recepción    / p4 Asistencia
       Hoja 3: p5 Recomend.    / p6 Dress Code
       Hoja 4: p7 Recuerdos    / p8 Fin
       Contratapa (fija, debajo): p9
     En móvil se ve una página a la vez y la "cámara" se desplaza
     entre izquierda y derecha (js/book.js).
════════════════════════════════════════════════════ -->
<div class="book-stage is-cover" id="book-stage">
  <div class="sky" aria-hidden="true"></div>

  <div class="book" id="book">

    <!-- Canto de las hojas: por leer (derecha) y ya leídas (izquierda) -->
    <div class="book-block" aria-hidden="true"></div>
    <div class="book-block-left" aria-hidden="true"></div>

    <!-- ══ CONTRATAPA (p9, debajo de todas las hojas) ══ -->
    <div class="back-cover">
      <div class="back-cover-inner">
        <div class="back-heart" aria-hidden="true"><span class="ts-heart">♥</span></div>
        <button class="back-restart" id="book-restart"><span data-t="book.backToStart"></span> ↺</button>
      </div>
      <p class="back-names" data-t="footerSignature"></p>
      <div class="back-footer">
        <img src="./assets/bugambilia.png" alt="" aria-hidden="true" class="back-tree">
      </div>
    </div>

    <!-- ══ HOJA 0: TAPA / GUARDA ══ -->
    <div class="leaf leaf-cover">
      <div class="leaf-front cover-front" id="cover-screen" role="button" tabindex="0" aria-label="Toca para abrir la invitación">
        <div class="cover-frame" aria-hidden="true"></div>
        <div class="fireflies" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="cover-inner">
          <div class="cover-monogram" aria-hidden="true">
            <span data-t="groomInitial"></span><span class="heart ts-heart">♥</span><span data-t="brideInitial"></span>
          </div>
          <p class="cover-names" data-t="couple"></p>
          <div class="cover-divider" aria-hidden="true">✦</div>
          <p class="cover-for" data-t="book.coverFor"></p>
          <p class="cover-guest" id="cover-guest"></p>
          <p class="cover-tap"><span aria-hidden="true">👆</span> <span data-t="cover.tap"></span></p>
        </div>
      </div>
      <div class="leaf-back" aria-hidden="true"><div class="leaf-back-ornament">✦ ♥ ✦</div></div>
    </div>

    <div class="leaf">
      <!-- p1 · Prólogo -->
      <div class="leaf-front"><div class="page-scroll">
        <section class="section" id="save-the-date" data-section="0">
          <div class="section-inner">
            <div class="ts-hero-wrap fade-in">
              <div class="section-img-wrap section-img-hero">
                <img src="./assets/mainPicture.png" alt="Camilo y Maritza" class="section-img img-0" />
                <div class="ts-hero-fade" aria-hidden="true"></div>
              </div>
              <div class="ts-monogram" aria-hidden="true">
                <span data-t="groomInitial"></span><span class="heart ts-heart">♥</span><span data-t="brideInitial"></span>
              </div>
            </div>

            <p class="chapter-num prologue-num fade-in" data-t="book.prologue"></p>
            <h1 class="once-upon fade-in" data-t="book.onceUpon"></h1>
            <span class="page-gap" aria-hidden="true"></span>
            <p class="story-text fade-in" data-t="book.prologueOpen"></p>
            <p class="story-text fade-in" data-t="book.prologueCouple"></p>

            <div class="couple-names fade-in">
              <span data-t="groom"></span>
              <span class="heart ts-heart">♥</span>
              <span data-t="bride"></span>
            </div>

            <p class="story-text story-guest fade-in" data-t="book.prologueGuest"></p>
            <!-- js/init.js lo necesita; en el libro el nombre va dentro del prólogo -->
            <p id="guest-greeting" hidden></p>

            <span class="page-gap" aria-hidden="true"></span>
            <p class="story-lead story-lead-date fade-in" data-t="book.dateLead"></p>
            <div class="ts-date-wrap fade-in">
              <img src="./assets/moon.png" alt="" aria-hidden="true" class="ts-date-flower">
              <div class="ts-date">
                <span class="sr-only" id="wedding-date-display"></span>
                <div class="ts-daynum" id="date-day" aria-hidden="true"></div>
                <div class="ts-month" id="date-month" aria-hidden="true"></div>
                <div class="ts-year" id="date-year" aria-hidden="true"></div>
                <div class="ts-location">📍 <span id="date-location"></span></div>
              </div>
              <img src="./assets/star.png" alt="" aria-hidden="true" class="ts-date-flower">
            </div>

            <span class="page-gap" aria-hidden="true"></span>
            <p class="story-lead fade-in" data-t="book.countdownLead"></p>
            <div class="countdown fade-in" id="countdown">
              <div class="countdown-unit"><span class="countdown-num" id="cd-days">--</span><span class="countdown-label" data-t="countdown.days"></span></div>
              <span class="countdown-sep">·</span>
              <div class="countdown-unit"><span class="countdown-num" id="cd-hours">--</span><span class="countdown-label" data-t="countdown.hours"></span></div>
              <span class="countdown-sep">·</span>
              <div class="countdown-unit"><span class="countdown-num" id="cd-mins">--</span><span class="countdown-label" data-t="countdown.minutes"></span></div>
              <span class="countdown-sep">·</span>
              <div class="countdown-unit"><span class="countdown-num" id="cd-secs">--</span><span class="countdown-label" data-t="countdown.seconds"></span></div>
            </div>
            <span class="page-gap" aria-hidden="true"></span>
          </div>
        </section>
      </div></div>
      <!-- p2 · Ceremonia -->
      <div class="leaf-back"><div class="page-scroll">
        <section class="section" id="ceremonia" data-section="1">
          <div class="section-inner">
            <p class="chapter-num fade-in" data-chapter></p>
            <h2 class="chapter-title fade-in" data-t="book.chapters.ceremonia"></h2>
            <div class="chapter-flourish fade-in" aria-hidden="true"><span class="ts-heart">♥</span></div>
            <p class="chapter-note fade-in" data-t="ceremony.label"></p>
            <p class="chapter-lead fade-in" data-t="book.leads.ceremonia"></p>

            <div class="section-img-wrap fade-in">
              <img src="./assets/foto2.png" alt="Ceremonia" class="section-img" />
              <div class="section-img-placeholder">
                <span class="img-ph-icon">⛪</span>
                <span class="img-ph-label">Iglesia / Capilla<br><small>1200 × 675 px · ratio 16:9</small></span>
              </div>
            </div>

            <div class="event-card fade-in">
              <div class="event-detail">
                <span class="icon">📍</span>
                <div class="text">
                  <strong data-t="ceremony.place"></strong>
                  <span data-t="ceremony.address"></span>
                </div>
              </div>
              <div class="event-detail">
                <span class="icon">📅</span>
                <div class="text">
                  <strong data-t="ceremony.date"></strong>
                  <span data-t="ceremony.time"></span>
                </div>
              </div>
              <div class="event-detail">
                <span class="icon">🕐</span>
                <div class="text">
                  <strong data-t="ceremony.arrival"></strong>
                  <span data-t="ceremony.doors"></span>
                </div>
              </div>
            </div>

            <a data-href="ceremony.mapLink" href="#" class="btn btn-blue fade-in" target="_blank" rel="noopener">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <span data-t="ceremony.mapLabel"></span>
            </a>
            <img src="./assets/rosas-tl.png" alt="" aria-hidden="true" class="corner-img tl">
          </div>
        </section>
      </div></div>
    </div>

    <div class="leaf">
      <!-- p3 · Recepción -->
      <div class="leaf-front"><div class="page-scroll">
        <section class="section" id="recepcion" data-section="2">
          <div class="section-inner">
            <p class="chapter-num fade-in" data-chapter></p>
            <h2 class="chapter-title fade-in" data-t="book.chapters.recepcion"></h2>
            <div class="chapter-flourish fade-in" aria-hidden="true"><span class="ts-heart">♥</span></div>
            <p class="chapter-note fade-in" data-t="reception.label"></p>
            <p class="chapter-lead fade-in" data-t="book.leads.recepcion"></p>

            <div class="section-img-wrap fade-in">
              <img src="./assets/foto3.png" alt="Recepción" class="section-img" />
              <div class="section-img-placeholder">
                <span class="img-ph-icon">🥂</span>
                <span class="img-ph-label">Pareja en la recepción<br><small>1200 × 675 px · ratio 16:9</small></span>
              </div>
            </div>

            <div class="event-card fade-in">
              <div class="event-detail">
                <span class="icon">📍</span>
                <div class="text">
                  <strong data-t="reception.place"></strong>
                  <span data-t="reception.address"></span>
                </div>
              </div>
              <div class="event-detail">
                <span class="icon">📅</span>
                <div class="text">
                  <strong data-t="reception.date"></strong>
                  <span data-t="reception.time"></span>
                </div>
              </div>
              <div class="event-detail">
                <span class="icon">🎶</span>
                <div class="text">
                  <strong data-t="reception.extraTitle"></strong>
                  <span data-t="reception.extraText"></span>
                </div>
              </div>
            </div>

            <a data-href="reception.mapLink" href="#" class="btn btn-blue fade-in" target="_blank" rel="noopener">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <span data-t="reception.mapLabel"></span>
            </a>
            <img src="./assets/rosas-tr.png" alt="" aria-hidden="true" class="corner-img tr">
          </div>
        </section>
      </div></div>
      <!-- p4 · Asistencia -->
      <div class="leaf-back"><div class="page-scroll">
        <section class="section" id="asistencia" data-section="3">
          <div class="section-inner">
            <p class="chapter-num fade-in" data-chapter></p>
            <h2 class="chapter-title fade-in" data-t="book.chapters.asistencia"></h2>
            <div class="chapter-flourish fade-in" aria-hidden="true"><span class="ts-heart">♥</span></div>
            <p class="chapter-note fade-in" data-t="rsvp.label"></p>
            <p class="chapter-lead fade-in" data-t="book.leads.asistencia"></p>

            <span class="page-gap" aria-hidden="true"></span>
            <p class="section-body fade-in" data-t="rsvp.message"></p>

            <span class="page-gap" aria-hidden="true"></span>
            <div class="section-img-wrap fade-in section-img-circle">
              <img src="./assets/foto4.png" alt="Confirma tu asistencia" class="section-img" />
              <div class="section-img-placeholder">
                <span class="img-ph-icon">💌</span>
                <span class="img-ph-label">Pareja / festejo<br><small>900 × 900 px · ratio 1:1</small></span>
              </div>
            </div>

            <span class="page-gap" aria-hidden="true"></span>
            <a data-href="rsvp.formLink" href="#" class="btn btn-glow fade-in" target="_blank" rel="noopener">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12V22H4V12"/><path d="M22 7H2v5h20V7z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/></svg>
              <span data-t="rsvp.buttonLabel"></span>
            </a>
            <span class="page-gap" aria-hidden="true"></span>
            <img src="./assets/rosas-tl.png" alt="" aria-hidden="true" class="corner-img tl">
            <img src="./assets/rosas-tr.png" alt="" aria-hidden="true" class="corner-img tr">
          </div>
        </section>
      </div></div>
    </div>

    <div class="leaf">
      <!-- p5 · Recomendaciones -->
      <div class="leaf-front"><div class="page-scroll">
        <section class="section" id="recomendaciones" data-section="4">
          <div class="section-inner">
            <p class="chapter-num fade-in" data-chapter></p>
            <h2 class="chapter-title fade-in" data-t="book.chapters.recomendaciones"></h2>
            <div class="chapter-flourish fade-in" aria-hidden="true"><span class="ts-heart">♥</span></div>
            <p class="chapter-note fade-in" data-t="recommendations.label"></p>
            <p class="chapter-lead fade-in" data-t="book.leads.recomendaciones"></p>

            <ul class="rec-list fade-in" id="rec-list"><!-- Generado por JS --></ul>
            <img src="./assets/rosas-tr.png" alt="" aria-hidden="true" class="corner-img tr">
          </div>
        </section>
      </div></div>
      <!-- p6 · Dress Code -->
      <div class="leaf-back"><div class="page-scroll">
        <section class="section" id="dresscode" data-section="5">
          <div class="section-inner">
            <p class="chapter-num fade-in" data-chapter></p>
            <h2 class="chapter-title fade-in" data-t="book.chapters.dresscode"></h2>
            <div class="chapter-flourish fade-in" aria-hidden="true"><span class="ts-heart">♥</span></div>
            <p class="chapter-note fade-in" data-t="dresscode.label"></p>
            <p class="chapter-lead fade-in" data-t="book.leads.dresscode"></p>

            <p class="section-body fade-in" data-t="dresscode.main"></p>

            <div class="dress-grid fade-in" id="dress-grid"><!-- Generado por JS --></div>

            <p class="section-body section-note fade-in" data-t="dresscode.note"></p>
            <img src="./assets/rosas-tl.png" alt="" aria-hidden="true" class="corner-img tl">
          </div>
        </section>
      </div></div>
    </div>

    <div class="leaf">
      <!-- p7 · Recuerdos -->
      <div class="leaf-front"><div class="page-scroll">
        <section class="section" id="qrs" data-section="6">
          <div class="section-inner">
            <p class="chapter-num fade-in" data-chapter></p>
            <h2 class="chapter-title fade-in" data-t="book.chapters.qrs"></h2>
            <div class="chapter-flourish fade-in" aria-hidden="true"><span class="ts-heart">♥</span></div>
            <p class="chapter-note fade-in" data-t="qrs.label"></p>
            <p class="chapter-lead fade-in" data-t="book.leads.qrs"></p>

            <div class="section-img-wrap fade-in">
              <img src="./assets/foto1.png" alt="Recuerdos" class="section-img" />
              <div class="section-img-placeholder">
                <span class="img-ph-icon">📸</span>
                <span class="img-ph-label">Pareja en su historia<br><small>1200 × 675 px · ratio 16:9</small></span>
              </div>
            </div>

            <p class="section-body fade-in" data-t="qrs.intro"></p>

            <div class="qr-grid fade-in" id="qr-grid"><!-- Generado por JS --></div>
            <img src="./assets/rosas-tl.png" alt="" aria-hidden="true" class="corner-img tl">
            <img src="./assets/rosas-tr.png" alt="" aria-hidden="true" class="corner-img tr">
          </div>
        </section>
      </div></div>
      <!-- p8 · Fin -->
      <div class="leaf-back"><div class="page-scroll">
        <div class="fin-page">
          <p class="fin-happy fade-in" data-t="book.happyEnding"></p>
          <p class="fin-end fade-in" data-t="book.theEnd"></p>
          <p class="fin-epilogue fade-in" data-t="book.epilogue"></p>
          <div class="fin-heart fade-in" aria-hidden="true"><span class="ts-heart">♥</span></div>
        </div>
      </div></div>
    </div>

  </div>

  <!-- Pistas, número de página y marcapáginas: fijos sobre lo que se ve -->
  <div class="book-hud" id="book-hud">
    <nav class="bookmark" id="bookmark" aria-label="Índice">
      <button class="bookmark-ribbon" id="bookmark-toggle" aria-expanded="false"><span data-t="book.index"></span></button>
      <div class="bookmark-panel" id="bookmark-panel">
        <ul id="nav-links" role="list"><!-- Generado por JS (WEDDING.nav) --></ul>
      </div>
    </nav>
    <div class="edge-arrows" aria-hidden="true">
      <span class="edge-arrow edge-next">›</span>
      <span class="edge-arrow edge-prev">‹</span>
    </div>
    <button class="turn-hint turn-prev" id="turn-prev"><span class="turn-arrow">‹</span> <span data-t="book.prev"></span></button>
    <span class="page-num" id="page-num" aria-live="polite"></span>
    <button class="turn-hint turn-next" id="turn-next"><span data-t="book.next"></span> <span class="turn-arrow">›</span></button>
    <p class="swipe-hint" id="swipe-hint" data-t="book.swipeHint"></p>
  </div>
</div>

<!-- ════════════════════════════════════════════════════
     JAVASCRIPT
     Orden: config → guest → init (textos, menú, audio) → countdown → book
     (no carga js/common.js: espera la barra de navegación y el scroll
     de invitacion-completa.html)
════════════════════════════════════════════════════ -->
<script src="config.js"></script>
<script src="js/guest.js"></script>
<script src="js/init.js"></script>
<script src="js/countdown.js"></script>
<script src="js/book.js"></script>

</body>
</html>
